name: Update Football Events

on:
  schedule:
    # Run twice a day: 19:00 UTC (12:00 AM PKT Midnight) and 07:00 UTC (12:00 PM PKT Noon)
    - cron: '0 7,19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'mappings/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Execute Football Events Pipeline
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/main.py

      - name: Validate Output JSON Schema
        run: |
          python scripts/validate_output.py output/upcoming_events.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ mappings/logo_index.json
          if git diff --staged --quiet; then
            echo "No changes detected in output artifacts."
          else
            git commit -m "Automated update: football events & match graphics [skip ci]"
            git push
          fi
